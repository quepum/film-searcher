basePath: /
definitions:
  domain.Movie:
    properties:
      director:
        type: string
      id:
        type: integer
      title:
        type: string
      year:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: HTTP API for films
  title: Film Searcher API
  version: "1.0"
paths:
  /last-movie:
    get:
      consumes:
      - application/json
      description: Find last available movie on stand
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Movie'
        "404":
          description: Not Found
          schema:
            type: string
        "502":
          description: Bad Gateway
          schema:
            type: string
        "504":
          description: Gateway Timeout
          schema:
            type: string
      summary: Get last movie
      tags:
      - movies
  /load-movies:
    get:
      consumes:
      - application/json
      description: Load movies from stand in range [from; to]
      parameters:
      - description: from
        in: query
        name: from
        required: true
        type: integer
      - description: to
        in: query
        name: to
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Movie'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Load movies in range
      tags:
      - movies
  /search:
    get:
      consumes:
      - application/json
      description: Search movies by words from title and director
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Movie'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Search movies
      tags:
      - movies
swagger: "2.0"
